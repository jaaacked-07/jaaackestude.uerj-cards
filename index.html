<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UERJ Cards">
<title>UERJ Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F2;--card:#FFFFFF;--ink:#2A1E21;--mute:#8C7F80;--line:#EFE6DD;
  --wine:#7A2E3B;--wine-soft:#F5E9EA;--rose:#C9967A;--rose-soft:#F7EEE7;
  --ok:#3F7D5C;--ok-soft:#E7F2EB;--bad:#B4443F;--bad-soft:#F8E8E6;--mid:#B7822F;--mid-soft:#F8F0E2;
  --r:18px;--shadow:0 1px 2px rgba(60,30,30,.04),0 8px 24px rgba(60,30,30,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1416;--card:#251C1F;--ink:#F3EAE4;--mute:#A6989A;--line:#3A2E31;
  --wine:#E3A3AE;--wine-soft:#3A2429;--rose:#D9AE93;--rose-soft:#33282A;
  --ok:#8CCBA6;--ok-soft:#203229;--bad:#EE9A94;--bad-soft:#3A2321;--mid:#E3BC78;--mid-soft:#3A3020;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 calc(140px + env(safe-area-inset-bottom))}
/* tela fixa: sem rolagem/zoom para os lados (só rola na vertical) */
html,body{overflow-x:hidden;max-width:100%;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-y}
.sess,.sbody,.end,.sheet{overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y}
img,svg,table,.vis{max-width:100%}
/* iOS dá zoom (e a tela fica andando) em campo com letra < 16px */
input,textarea,select{font-size:16px!important}
.fld input{font-size:22px!important}
#sn{font-size:19px!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px}
.serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em}
.mute{color:var(--mute)}
.small{font-size:13px}
.hide{display:none!important}

/* home */
.hello{font-size:15px;color:var(--mute);margin:8px 0 2px}
.count{font-size:44px;line-height:1.1}
.count small{display:block;font:500 14px Inter,sans-serif;color:var(--mute);margin-top:6px;letter-spacing:0}
.ringbox{display:flex;justify-content:center;margin:34px 0 26px}
.ring{position:relative;width:188px;height:188px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font-size:40px;line-height:1}
.ring .l{font-size:13px;color:var(--mute);margin-top:6px}
.btn{display:block;width:100%;padding:17px;border-radius:16px;background:var(--wine);color:#fff;font-weight:600;font-size:17px;box-shadow:var(--shadow);transition:transform .12s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#1B1416}}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--wine);box-shadow:none;border:1.5px solid var(--line);font-weight:500;font-size:15px;padding:13px}
.stats{display:flex;justify-content:center;gap:26px;margin-top:22px;font-size:14px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:600}
.linkrow{text-align:center;margin-top:28px}
.link{color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.done{text-align:center;padding:6px 0 4px}
.done .serif{font-size:22px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;gap:0!important;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px 4px;min-width:0;flex:0 1 66px;border-radius:12px;position:relative}
nav button.on{color:var(--wine)}
nav svg{width:24px;height:24px}
.dot{position:absolute;top:4px;right:12px;min-width:8px;height:8px;border-radius:8px;background:var(--bad)}

/* session */
.sess{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sbar .vt.hide{visibility:hidden}
.sbar .nbtn{font:700 14px Inter,sans-serif;color:var(--wine);border:1.5px solid var(--line);background:var(--card)}
.sel.tog .sw{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;margin-left:8px;transition:background .15s}
.sel.tog .sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.sel.tog.on .sw{background:var(--wine)}.sel.tog.on .sw i{left:19px}
.voltarev{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:0 0 12px;padding:11px;border-radius:14px;background:var(--wine-soft);color:var(--wine);font-weight:600;font-size:14.5px}
.sbar{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:520px;width:100%;margin:0 auto}
.sbar .x{width:32px;height:32px;display:grid;place-items:center;color:var(--mute);border-radius:10px}
.prog{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--wine);border-radius:6px;transition:width .35s ease}
.pcount{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.combo{font-size:13px;color:var(--rose);font-weight:600;min-width:34px;text-align:right}
.sbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
html:has(body>.sess),html:has(body>.sess) body{overflow:hidden!important;height:100%}
.sbody .wrap{padding-top:6px;padding-bottom:140px}
.tag{font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.q{font-size:23px;line-height:1.3}
.ans{margin-top:22px;animation:up .28s ease}
.ans p{font-size:17px}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pega{margin-top:16px;background:var(--mid-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
.pega b{color:var(--mid)}
.mac{margin-top:14px;background:#FFF4D6;border:1.5px dashed #E2B53E;border-radius:14px;padding:11px 14px;font-size:15px;color:#4A3A10}
.mac b{color:#9A6B00}
@media (prefers-color-scheme:dark){.mac{background:#3A3018;color:#F3E6C4;border-color:#8A6D25}.mac b{color:#F2C960}}
.dig{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.dig input{width:100%;font-size:17px;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.dig input:focus{border-color:var(--rose)}
.dig .dh{font-size:12.5px;color:var(--mute)}
.dgr{margin:14px 0 4px;padding:10px 14px;border-radius:14px;font-size:15px}
.dgr.ok{background:#E3F2E6;color:#24633A}.dgr.bad{background:#F8E1E3;color:#8A2A35}
@media (prefers-color-scheme:dark){.dgr.ok{background:#1F3A27;color:#9FDCB0}.dgr.bad{background:#3E2226;color:#F2AEB6}}
.rate button.sug{outline:2.5px solid currentColor;outline-offset:2px}
.uerj{margin-top:12px;background:var(--wine-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
.uerj b{color:var(--wine)}
.src{margin-top:14px;font-size:12px;color:var(--mute)}
.sfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -10px 20px -12px rgba(60,30,30,.18)}
.sfoot:empty,.sfoot .in:empty{box-shadow:none}
.sfoot .in{max-width:520px;margin:0 auto}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate button{padding:15px 6px;border-radius:14px;font-weight:600;font-size:15px}
.r0{background:var(--bad-soft);color:var(--bad)}.r1{background:var(--mid-soft);color:var(--mid)}.r2{background:var(--ok-soft);color:var(--ok)}
.why{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;animation:up .2s ease}
.why span{font-size:12.5px;color:var(--mute);width:100%;text-align:center}
.chip{padding:8px 13px;border-radius:20px;border:1.5px solid var(--line);font-size:14px}
.chip.on{border-color:var(--wine);background:var(--wine-soft);color:var(--wine)}

/* quiz */
.opts{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 15px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:16px;display:flex;gap:12px;align-items:flex-start;transition:background .2s}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.opt .c{display:block;font-size:14px;color:var(--mute);margin-top:6px}
.opt.ok{background:var(--ok-soft)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad-soft)}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

/* visuals */
.vis{margin-top:18px}
table.t{width:100%;table-layout:auto;overflow-wrap:break-word;word-break:normal;hyphens:auto;-webkit-hyphens:auto;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;font-size:14px}
.t th{text-align:left;font-weight:600;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td:first-child{font-weight:600;color:var(--wine)}
.t td.hl{font-weight:700;color:var(--wine)}
.tcap{display:none}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.fn{background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:9px 16px;font-size:14.5px;text-align:center;min-width:60%}
.fr{display:flex;gap:8px;width:100%;justify-content:center}.fr .fn{min-width:0;flex:1}
.fa{width:2px;height:16px;background:var(--rose);position:relative;margin:2px 0 6px}
.fa:after{content:"";position:absolute;bottom:-5px;left:-4px;border:5px solid transparent;border-top-color:var(--rose)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.vs .s{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:14px;text-align:center}
.vs .s h4{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:17px;color:var(--wine);margin-bottom:6px}
.vs .s div{font-size:14px}
.vs .o{align-self:center;font-size:12px;color:var(--mute);font-weight:600}
.li{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:6px 14px}
.li div{padding:9px 0 9px 18px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.li div:last-child{border-bottom:0}
.li div:before{content:"";position:absolute;left:2px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--rose)}
.li div.hl{color:var(--wine);font-weight:600}.li div.hl:before{background:var(--wine)}
.grp{display:flex;flex-direction:column;gap:12px}
/* nada de tabela/visual cortado ou rolando para o lado: tudo quebra linha e cabe na tela */
.vis,.vis *{min-width:0;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.vis{max-width:100%;overflow:visible}
@media (max-width:560px){
  table.t{font-size:13.5px}
  .t th,.t td{padding:8px 9px}
  /* tabela com 3+ colunas vira fichas empilhadas no celular */
  table.t.larga,table.t.larga tbody,table.t.larga tr,table.t.larga td{display:block;width:100%}
  table.t.larga tr:first-child:has(th){display:none}
  table.t.larga tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  table.t.larga tr:last-child{border-bottom:0}
  table.t.larga td{border:0;padding:2px 0}
  table.t.larga td[data-l]:not(:first-child)::before{content:attr(data-l) ' · ';font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
  table.t.larga td:first-child{font-size:15px;margin-bottom:2px}
  table.t.larga td.vz{display:none}
  table.t.larga .tcap{display:block;text-align:left;padding:10px 12px 8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);border-bottom:1px solid var(--line)}
  .vs{grid-template-columns:1fr;gap:6px}
  .vs .o{justify-self:center}
}
.grp .g h5{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin-bottom:7px}
.grp .g .cs{display:flex;flex-wrap:wrap;gap:6px}
.grp .g .cs span{background:var(--rose-soft);border-radius:10px;padding:5px 10px;font-size:14px}
.vsvg{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px}
.vsvg svg{display:block;width:100%;height:auto}
.vimg{background:var(--card);box-shadow:var(--shadow);border-radius:14px;overflow:hidden;text-align:center;padding:10px}
.vimg img{display:block;margin:0 auto;max-width:100%;max-height:300px;width:auto;height:auto;object-fit:contain;border-radius:8px}
.nimgs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.nimgs .th{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.nimgs .th img{width:100%;height:100%;object-fit:cover;display:block}
.nimgs .th button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:20px}
.nt .nimgs{justify-content:flex-start;margin-top:8px}.nt .nimgs .th{width:48px;height:48px}
.nfull{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:12px}
.nfull img{max-width:100%;max-height:260px;width:auto;height:auto;object-fit:contain;border-radius:10px;box-shadow:var(--shadow)}
.addimg{display:block;margin:10px auto 0;font-size:13.5px;color:var(--rose);font-weight:500}
.vcap{font-size:12.5px;color:var(--mute);padding:8px 12px}
.ans p+p{margin-top:6px}
.ans .blq+.blq{margin-top:14px}
.ctx{margin-top:34px;padding:16px 18px 18px;background:var(--rose-soft);border-radius:16px;border-left:3px solid var(--rose)}
.ctxh{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:17px;color:var(--wine);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ctxh::before{content:"✦";font-style:normal;font-size:13px;color:var(--rose)}
.ctx .blq{font-family:Fraunces,Georgia,serif;letter-spacing:-.005em}
.ans .ctx p,.ans .ctx li{font-size:15px;line-height:1.5}
.ctx .blq+.blq{margin-top:12px}
.ctx .lbl{font-family:Inter,system-ui,sans-serif;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--wine);margin-bottom:2px}
.ans p.lbl{font-weight:600}
.ans ul.sub{margin:3px 0 2px;padding-left:18px}
.ans ul.sub li{font-size:.95em;margin:3px 0}
.ans ul.sub li::marker{content:"◦  ";color:var(--mute)}
.ans ul{margin:6px 0 0;padding-left:20px}
.ans .resp{background:var(--wine-soft);border-left:4px solid var(--wine);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.ans .resp p{font-family:Fraunces,Georgia,serif;font-size:21px;line-height:1.35;color:var(--wine);font-weight:500}
.ans .resp p+p{margin-top:10px;padding-top:8px;border-top:1px dashed color-mix(in srgb,var(--wine) 25%,transparent)}
.ans .resp .blq{margin:0}
.ans .resp ul{margin:4px 0 0}
.ans .resp li{font-family:Fraunces,Georgia,serif;font-size:18px;color:var(--wine);margin:3px 0;line-height:1.35}
.ans .resp li::marker{color:var(--wine)}
.ans .resp p.lbl{font-family:Fraunces,Georgia,serif;font-size:21px;text-transform:none;letter-spacing:0}
.ans .resp strong{font-weight:700}
.ans .expl p,.ans .expl li{color:var(--ink);opacity:.92}
.ans li{margin:5px 0;font-size:16px;line-height:1.45}
.ans li::marker{color:var(--rose)}
.ans strong,.pega strong,.uerj strong,.opt strong{font-weight:600;color:var(--wine)}

/* end */
.end{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.end .big{font-size:34px;margin:14px 0 6px}
.end .xp{font-size:15px;color:var(--rose);font-weight:600;margin-top:16px}
.end .row{display:flex;gap:28px;margin:26px 0 34px;font-size:14px;color:var(--mute)}
.end .row b{display:block;font-size:22px;color:var(--ink);font-family:Fraunces,Georgia,serif;font-weight:500}
.end .btn{max-width:320px}
.lvl{font-size:13px;background:var(--wine-soft);color:var(--wine);border-radius:20px;padding:5px 12px;margin-top:12px;font-weight:600}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}

/* pages */
h2.serif{font-size:28px;margin:6px 0 18px}
.empty{text-align:center;padding:50px 10px;color:var(--mute)}
.empty .serif{font-size:20px;color:var(--ink);margin-bottom:6px}
.bars{display:flex;flex-direction:column;gap:9px;margin-bottom:24px}
.bar{display:grid;grid-template-columns:96px 1fr 26px;gap:10px;align-items:center;font-size:14px}
.bar .b{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--bad);border-radius:8px}
.bar .v{text-align:right;color:var(--mute);font-size:13px}
.mapa{display:flex;flex-direction:column;gap:12px}
.ma{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:10px 12px 6px}
.mah{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;font-family:Fraunces,Georgia,serif;font-size:16px;color:var(--wine);padding:4px 0 6px}
.mah .mt{display:flex;align-items:center;gap:8px}
.mah .chv{font-style:normal;font-size:10px;color:var(--mute);transition:transform .15s}
.ma.ab .mah .chv{transform:rotate(90deg)}
.mah>span:last-child{font:500 11px Inter,system-ui,sans-serif;color:var(--mute);text-align:right}
.mah .mt{font-family:Fraunces,Georgia,serif;font-size:16px;color:var(--wine)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 70px 36px;grid-template-rows:auto auto;column-gap:8px;align-items:center;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--line)}
.mrow .mn{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mb{height:7px;background:var(--line);border-radius:7px;overflow:hidden}.mrow .mb i{display:block;height:100%;border-radius:7px}
.mrow .mv{font-size:12.5px;font-weight:600;text-align:right}
.mrow .ms{grid-column:1/-1;font-size:11px;color:var(--mute)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin:22px 0 8px}
.rows{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}

<script>
/* ===== Config ===== */
const NOME='Jacke';
const PROVA='2026-11-01';
const VESPERA='2026-10-31';
const META=20;            // cards por dia
const MIN_NOVOS=15;       // novos garantidos na fila do dia (se houver)
const MIN_REV=5;          // revisões vencidas garantidas
const LS='uerjcards.v1';

/* ===== Datas ===== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);

/* ===== Estado ===== */
let S;
try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){S={}}
const DEV=(()=>{try{let d=localStorage.getItem(LS+'.dev');if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem(LS+'.dev',d)}return d}catch(e){return 'x'}})();
function fixS(){ (S.notas||[]).forEach(n=>(n.imgs||[]).forEach(im=>{ if(im&&im.path&&im.local) delete im.local; }));S.srs=S.srs||{}; S.xp=S.xp||0; S.streak=S.streak||{n:0,last:null}; S.notas=S.notas||[]; S.extra=S.extra||[]; S.plan=S.plan||null; S.fav=S.fav||{}; S.minha=S.minha||{}; S.ren=S.ren||{tema:{},sub:{}}; S.ren.area=S.ren.area||{}; S.edit=S.edit||{}; S.oculto=S.oculto||{}; migrarRet();
  S.xpDev=S.xpDev||{}; if(S.xp&&!Object.keys(S.xpDev).length) S.xpDev[DEV]=S.xp;
  S.dias=S.dias||{}; if(S.streak&&S.streak.last&&!Object.keys(S.dias).length) for(let i=0;i<S.streak.n;i++) S.dias[addD(S.streak.last,-i)]=1;
  S.notasDel=S.notasDel||{}; S.sim=S.sim||[]; S.simDel=S.simDel||{}; S.decks=S.decks||[]; S.decksDel=S.decksDel||{}; S.marks=S.marks||{}; S.lido=S.lido||{};
  if(typeof recalc==='function') recalc();}
fixS();
/* se o armazenamento do aparelho lotar (fotos em cache), libera o cache de fotos e tenta de novo — o progresso nunca deixa de ser salvo */
let LSAVISO=false;
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){}
  try{ localStorage.removeItem(LS+'.imgc'); localStorage.setItem(k,v); return true; }catch(e){}
  if(!LSAVISO){ LSAVISO=true; setTimeout(()=>toast('Armazenamento do aparelho cheio'),300); } return false; }
const saveLocal=()=>{ lsSet(LS,JSON.stringify(S)); };
const save=()=>{saveLocal();if(typeof agendarSync==='function')agendarSync()};

/* ===== Cards ===== */
let CARDS=[], BYID={}, RAW={}, LASTBASE=[];
const AREA_PADRAO={'ginecologia':'Ginecologia','obstetrícia':'Obstetrícia','obstetricia':'Obstetrícia','preventiva':'Medicina Preventiva','medicina preventiva':'Medicina Preventiva','pediatria':'Pediatria','cirurgia':'Cirurgia'};
/* sub-áreas fixas: aparecem sempre, mesmo sem cards */
const MATERIAS_FIXAS={'Clínica Médica':['Cardiologia','Dermatologia','Endocrinologia','Gastroenterologia','Hematologia','Infectologia','Nefrologia','Neurologia','Pneumologia','Psiquiatria','Reumatologia']};
const fixasVazias=()=>Object.entries(MATERIAS_FIXAS).flatMap(([area,ms])=>ms.map(tema=>({area,tema})));
const areaRaw=c=>c.area||AREA_PADRAO[String(c.tema).toLowerCase()]||'Clínica Médica';
const dArea=c=>S.ren.area[areaRaw(c)]||areaRaw(c);
const dTema=c=>S.ren.tema[c.tema]||c.tema;
const dSub=c=>S.ren.sub[c.tema+'|'+c.sub]||c.sub;
function setCards(base){
  LASTBASE=base||[];
  const m={};
  LASTBASE.forEach(c=>m[c.id]=c);
  (S.extra||[]).forEach(c=>{ if(!c.del) m[c.id]=c; });
  RAW=m; const out={};
  Object.values(m).forEach(c0=>{ if(oculto(c0)) return;
    const ed=S.edit[c0.id]||{}, c={...c0,...ed}; c.area=ed.area||dArea(c0); c.tema=ed.tema||dTema(c0); c.sub=ed.sub||dSub(c0);
    c.fav = c0.id in S.fav ? !!S.fav[c0.id] : !!c0.fav;
    c.minha = c0.id in S.minha ? S.minha[c0.id] : (c0.minha||'');
    if(!c.pegadinha) delete c.pegadinha; if(!c.uerj) delete c.uerj; if(!c.subt) delete c.subt;
    out[c.id]=c; });
  CARDS=Object.values(out); BYID=out;
}
const reaplicar=()=>setCards(LASTBASE);
const oculto=c0=>c0.id in S.oculto ? !!S.oculto[c0.id] : !!c0.oculto;
const abc=(a,b)=>a.localeCompare(b,'pt',{sensitivity:'base'});
async function carregar(){
  /* cards.json ficou grande (> 3 MB): não cabe mais no armazenamento local — a cópia offline fica com o service worker.
     (antes a gravação falhava e o app continuava com a cópia velha, sem os cards novos) */
  let base=null;
  try{ localStorage.removeItem(LS+'.cache'); }catch(e){}
  try{
    const r=await fetch('data/cards.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){ const j=await r.json(); base=j; setCards(j.cards); }
  }catch(e){}
  if(!CARDS.length && !base) setCards([]);
  migrarMarcasCtx(); migrarIO(); migrarSubtemas();
  try{ PREV=JSON.parse(localStorage.getItem(LS+'.prev'))||PREV }catch(e){}
  try{ const r=await fetch('data/prevalencia.json?t='+Date.now(),{cache:'no-store'}); if(r.ok){ PREV=await r.json(); localStorage.setItem(LS+'.prev',JSON.stringify(PREV)); } }catch(e){}
}
/* ===== Prioridade pela UERJ (Foco UERJ: questões 2022–2026) ===== */
let PREV={areas:{},baralhos:{}};
const PREVN={}; let PREVREF=null;
function qUERJ(c){ const B=PREV.baralhos||{}; if(B[c.sub]) return B[c.sub].q||0;
  if(PREVREF!==B){ PREVREF=B; for(const k in PREVN) delete PREVN[k]; Object.keys(B).forEach(k=>PREVN[norm(k)]=B[k]); }
  const e=PREVN[norm(c.sub)]; return e?e.q||0:0; }
/* nota de prioridade: questões do tema na UERJ pesam mais; % da grande área desempata */
const pesoUERJ=c=>qUERJ(c)*10+((PREV.areas||{})[c.area]||0)/3;
const nivelUERJ=q=>q>=4?'alta':q>=2?'media':'baixa';
/* ===== Modo véspera: sanguessugas, fracos, favoritos, marcados e o que mais cai — sem cards novos ===== */
const VESP_INI='2026-10-30';
function filaVespera(){
  const P=c=>S.srs[c.id], marc=id=>S.marks&&S.marks[id]&&S.marks[id].l&&S.marks[id].l.length;
  /* sanguessugas primeiro; depois o resto pela prioridade combinada (o que mais cai na UERJ + fraco + favorito/marcado), intercalando baralhos */
  const sel=CARDS.filter(c=>P(c)&&(ehFraco(P(c))||c.fav||marc(c.id)||prioDe(c)==='alta'||(qUERJ(c)>=2&&prioDe(c)!=='baixa')));
  const sg=intercalar(sel.filter(c=>ehSanguessuga(P(c))),prioridade), resto=intercalar(sel.filter(c=>!ehSanguessuga(P(c))),prioridade);
  return [...sg,...resto].map(c=>c.id);
}
const vesperaAtiva=()=>{const h=hoje(); return h>=VESP_INI&&h<PROVA;};
function vesperaHTML(destaque){ const n=filaVespera().length; if(!n) return '';
  return `<button class="btn ${destaque?'':'ghost'} vespb" style="margin-top:14px">🌙 Modo véspera · ${n}</button>${destaque?`<p class="mute small" style="text-align:center;margin-top:6px">Só o que importa: sanguessugas, fracos, favoritos, o que você marcou e o que mais cai na UERJ. Sem cards novos.</p>`:''}`; }
function ligarVespera(){ document.querySelectorAll('.vespb').forEach(b=>b.onclick=()=>sessao(filaVespera(),'vespera',null,'modo véspera')); }
/* ===== Fraco e sanguessuga ===== */
/* fraco = ainda não acertou 3× seguidas ("Sabia") E já errou OU marcou "Quase" alguma vez */
const quaseN=x=>x.q!=null?x.q:Math.max(0,Math.round((2.5-(x.ease||2.5)-0.2*(x.lapses||0))/0.15));
const ehFraco=x=>!!x&&(x.box||0)<3&&((x.wrong||0)>0||quaseN(x)>0);
/* sanguessuga (termo do Anki) = card errado 4 ou mais vezes: repetir não está resolvendo */
const LEECH=4;
const ehSanguessuga=x=>!!x&&(x.wrong||0)>=LEECH&&(x.box||0)<3;
const LEECH_TXT='Sanguessuga é o card que você já errou 4 ou mais vezes: só repetir não está resolvendo. Reescreva o card (✎), crie um macete na sua anotação ou estude o tema de novo.';

/* ===== Revisão estilo Anki, comprimida até a prova ===== */
/* Cada card tem facilidade (ease), intervalo (ivl), acertos seguidos (box) e lapsos.
   Errei → volta na mesma rodada e amanhã; facilidade cai.
   Quase → intervalo cresce pouco (×1,2); facilidade cai um pouco.
   Sabia → 1 dia, 3 dias, depois intervalo × facilidade (como o Anki).
   Antes da prova o intervalo é limitado a metade dos dias que faltam (todo card ainda passa
   pelo menos ~2 vezes antes de 01/11) e nada fica marcado para depois da véspera.
   Card errado recentemente nunca fica mais de 2 dias sem voltar. */
function rating(id,r,tipoErro){
  const s=S.srs[id]||{box:0,seen:0,wrong:0};
  if(s.ease==null){s.ease=2.5;s.ivl=0;s.reps=0;s.lapses=0}
  const h=hoje(), jaHoje=s.last===h&&s.due; s.seen++; s.last=h; s.lr=r; s.t=Date.now();
  /* card repetido no mesmo dia (outra rodada manual): acerto não "empurra" a revisão de novo; erro conta normalmente */
  if(jaHoje&&r>0){ S.srs[id]=s; return; }
  let ivl;
  if(r===0){ s.wrong++; s.lapses++; s.box=0; s.reps=0; s.ease=Math.max(1.3,s.ease-0.2); if(tipoErro) s.et=tipoErro; ivl=1; }
  else if(r===1){ s.q=quaseN(s)+1; s.ease=Math.max(1.3,s.ease-0.15); ivl=s.reps===0?1:Math.max(1,Math.round((s.ivl||1)*1.2)); s.reps++; }
  else { s.box++; ivl=s.reps===0?1:s.reps===1?3:Math.max(1,Math.round((s.ivl||1)*s.ease)); s.reps++; }
  const falta=diff(h,PROVA);
  if(falta>1){
    let cap=Math.max(1,Math.floor(falta/2));
    if(s.lapses>0&&s.box<2) cap=Math.min(cap,2);
    ivl=Math.min(ivl,cap);
    if(addD(h,ivl)>VESPERA) ivl=Math.max(1,diff(h,VESPERA));
  }
  s.ivl=ivl; s.due=addD(h,ivl); S.srs[id]=s;
}
const due=c=>S.srs[c.id]&&S.srs[c.id].due<=hoje();
/* ===== Prioridade combinada + intercalar baralhos =====
   prioridade = quanto cai na UERJ + fraco + vezes que errou + favorito/marcado + atraso da revisão.
   intercalar = escolhe sempre o melhor, mas cada card já escolhido de um baralho reduz a vez dele
   (não vira 10 cards seguidos do mesmo tema). jitter = um pouco de acaso (modo aleatório). */
const marcado=id=>!!(S.marks&&S.marks[id]&&S.marks[id].l&&S.marks[id].l.length);
function prioridade(c){
  const x=S.srs[c.id]; let p=pesoUERJ(c)+prioP(c);
  if(x){ if(ehFraco(x)) p+=30; p+=Math.min(x.lapses||0,4)*8; if(x.due&&x.due<hoje()) p+=Math.min(20,diff(x.due,hoje())*4); }
  if(c.fav) p+=12; if(marcado(c.id)) p+=8;
  return p;
}
function intercalar(lista,score,jitter){
  const g={}; lista.forEach(c=>{ (g[kSub(c)]=g[kSub(c)]||[]).push({c,v:score(c)+(jitter?Math.random()*jitter:0)}); });
  Object.values(g).forEach(a=>a.sort((x,y)=>y.v-x.v));
  const ks=Object.keys(g), usados={}, out=[];
  for(;;){ let best=null,bv=-1e9; ks.forEach(k=>{ if(!g[k].length) return; const v=g[k][0].v-15*(usados[k]||0); if(v>bv){bv=v;best=k;} });
    if(!best) break; out.push(g[best].shift().c); usados[best]=(usados[best]||0)+1; }
  return out;
}
/* curadoria: prioridade do card (alta/media/baixa) pesa na escolha; card de prioridade baixa só entra como novo depois dos outros */
/* prioridade do card: campo prio; card que ela mesma criou (aba Criar) conta como alta */
const prioDe=c=>c.prio||(c.meu?'alta':'media');
const PRIO_P={alta:40,media:0,baixa:-40}, prioP=c=>PRIO_P[prioDe(c)]||0;

/* ===== correção do card de digitar (tolerante) =====

   - símbolos e palavras de comparação valem igual: ≥ >= "maior ou igual" "maior que" "acima de" "pelo menos"…

const CMP=[[/≥|>=|=>|\bmaior ou igual( a| que)?\b|\bpelo menos\b|\bno minimo\b|\ba partir de\b/g,' MAIOR '],[/≤|<=|=<|\bmenor ou igual( a| que)?\b|\bno maximo\b|\bate\b/g,' MENOR '],

function normR(t){
  let x=String(t||'').toLowerCase().replace(/λ/g,' lambda ').replace(/κ/g,' kappa ').replace(/α/g,' alfa ').replace(/β/g,' beta ').replace(/γ/g,' gama ').normalize('NFD').replace(/[̀-ͯ]/g,'');

const UNI=new Set('mmol l mg dl ml meq g kg mcg ug h min dia dias semana semanas mes meses ano anos cm mm mmhg ui u vezes x'.split(' '));

const OPOSTOS=[['hiper','hipo'],['nefrot','nefrit'],['bradi','taqui'],['micro','macro'],['inter','intra'],['hipo','hiper'],['endo','exo'],['ante','retro'],['pre','pos'],['anti','pro']];

  lista.forEach(c=>{const A=(t[c.area]=t[c.area]||{}),M=(A[c.tema]=A[c.tema]||{});(M[c.sub]=M[c.sub]||[]).push(c); addSt(c);});

function ordenar(pool){ const h=hoje(), feito=c=>S.srs[c.id]&&S.srs[c.id].last===h, L=ordenar0(pool); return [...L.filter(c=>!feito(c)),...L.filter(feito)]; }
function ordenar0(pool){
  const pos=new Map(CARDS.map((c,i)=>[c.id,i])), P=c=>S.srs[c.id]||{};
  const L=pool.slice(), o=DECK.ordem;
  if(o==='aleat') return intercalar(L,prioridade,60);   // aleatória, mas puxando o que mais cai na UERJ e o que está fraco
  if(o==='uerj') return intercalar(L,pesoUERJ);

  if(o==='novo') return L.sort((a,b)=>(b.add||'').localeCompare(a.add||'')||pos.get(b.id)-pos.get(a.id));
  if(o==='errados') return L.sort((a,b)=>(P(b).wrong||0)-(P(a).wrong||0)||Math.random()-.5);
  if(o==='fracos') return L.sort((a,b)=>(P(a).box||0)-(P(b).box||0)||(P(a).ease||2.5)-(P(b).ease||2.5));
  if(o==='assunto') return L.sort((a,b)=>abc(a.area+a.tema+a.sub,b.area+b.tema+b.sub)||pos.get(a.id)-pos.get(b.id));

function deckPool(){

function soltar(src,alvo){
  const A=parseK(alvo.dataset.k);
  if(src.dataset.card){ const [a,t,su,st]=A.p; moverCard(src.dataset.card,{area:a,tema:t,sub:su,subt:st||''}); abrir('s:'+a+'|'+t+'|'+su); if(st) abrir(alvo.dataset.k); concluirOrg('Card movido para '+(st||su)); return; }
  const S0=parseK(src.dataset.k);
  if(S0.t==='u'){ const [a,t,su,st]=S0.p, [a2,t2,s2,st2]=A.p, novo=st2||st;
    CARDS.filter(c=>c.area===a&&c.tema===t&&c.sub===su&&c.subt===st).forEach(c=>moverCard(c.id,{area:a2,tema:t2,sub:s2,subt:novo}));
    S.decks.forEach(d=>{ if(d.area===a&&d.tema===t&&d.sub===su&&d.subt===st){ d.area=a2; d.tema=t2; d.sub=s2; d.subt=novo; } });
    abrir('a:'+a2,'m:'+a2+'|'+t2,'s:'+a2+'|'+t2+'|'+s2,'u:'+a2+'|'+t2+'|'+s2+'|'+novo); concluirOrg(st2?'Juntado em '+st2:'Subtema movido para '+s2); return; }
  if(S0.t==='s'){ const [a,t,su]=S0.p;
    /* baralho solto em cima de outro baralho → vira SUBTEMA dele (os subtemas que ele já tinha continuam) */
    if(A.t==='s'){ const [a2,t2,s2]=A.p; aplicarDestino('sub',a,t,su,x=>({area:a2,tema:t2,sub:s2,subt:x.subt||su})); abrir('a:'+a2,'m:'+a2+'|'+t2,'s:'+A.p.join('|')); concluirOrg('"'+su+'" virou subtema de '+s2); }
    else { const [a2,t2]=A.p; aplicarDestino('sub',a,t,su,()=>({area:a2,tema:t2,sub:su})); abrir('a:'+a2,'m:'+a2+'|'+t2); concluirOrg('Movido para '+t2); }
    return; }
  if(S0.t==='m'){ const [a,t]=S0.p;
    if(A.t==='m'){ const [a2,t2]=A.p; aplicarDestino('tema',a,t,null,x=>({area:a2,tema:t2,sub:x.sub})); abrir('a:'+a2,'m:'+a2+'|'+t2); concluirOrg('Juntado em '+t2); }
    else { const a2=A.p[0]; aplicarDestino('tema',a,t,null,x=>({area:a2,tema:t,sub:x.sub})); abrir('a:'+a2,'m:'+a2+'|'+t); concluirOrg('Movido para '+a2); }
  }
}

function criarDeck(area,tema,sub){
  if(!CARDS.some(c=>c.area===area&&c.tema===tema&&c.sub===sub)&&!S.decks.some(d=>d.area===area&&d.tema===tema&&d.sub===sub))
    S.decks.push({id:Date.now(),area,tema,sub});
  ABERTO.add('a:'+area); ABERTO.add('m:'+area+'|'+tema); ABERTO.add('s:'+area+'|'+tema+'|'+sub);
  save(); fecharFolha(); toast('Baralho criado'); render();
}
function moverCard(id,d){
  const r=RAW[id]; if(!r) return; const atual=BYID[id]||r, st=d.subt===undefined?(atual.subt||''):(d.subt||'');
  /* card criado por ela: muda o próprio card (vai para os outros aparelhos pelo progresso) */
  const x=(S.extra||[]).find(e=>e.id===id&&!e.del);
  if(x){ x.area=d.area; x.tema=d.tema; x.sub=d.sub; if(st) x.subt=st; else delete x.subt; x.u=Date.now(); delete S.edit[id]; agendarSync(); return; }
  const e={...(S.edit[id]||{})};
  ['area','tema','sub'].forEach(k=>{ const orig=k==='area'?dArea(r):k==='tema'?dTema(r):dSub(r); if(d[k]!==orig) e[k]=d[k]; else delete e[k]; });
  if(st!==(r.subt||'')) e.subt=st; else delete e.subt;
  if(Object.keys(e).length) S.edit[id]=e; else delete S.edit[id];
}
function depoisDeMover(d){

  ABERTO.add('a:'+d.area); ABERTO.add('m:'+d.area+'|'+d.tema); ABERTO.add('s:'+d.area+'|'+d.tema+'|'+d.sub);

}

/* anotação pessoal: texto + fotos coladas, guardadas como ![](data/img/...) dentro do próprio texto */
const IMG_RE=/!\[([^\]]*)\]\(([^)\s]+)\)/g;
/* anotação: **negrito**, __sublinhado__, {v}vermelho{/v}; fotos ![p|m|](src) = pequena/média/grande; fotos na mesma linha = lado a lado */
const fmtNota=t=>esc(t).replace(/\*\*([\s\S]+?)\*\*/g,'<b>$1</b>').replace(/__([\s\S]+?)__/g,'<u>$1</u>').replace(/\{v\}([\s\S]*?)\{\/v\}/g,'<span class="vm">$1</span>').replace(/\{\/?v\}/g,'');
const imgTag=(a,src)=>`<img class="mimg ${a==='p'?'sp':a==='m'?'sm':'sg'}" src="${esc(imgSrc(src))}" data-p="${esc(src)}" alt="" data-zoom onerror="imgFalhou(this)">`;
function minhaCorpo(t){
  t=String(t); let h='',i=0; const toks=[...t.matchAll(IMG_RE)];
  for(let j=0;j<toks.length;){ const g=[toks[j]]; while(j+g.length<toks.length&&/^[ \t]*$/.test(t.slice(g[g.length-1].index+g[g.length-1][0].length,toks[j+g.length].index))) g.push(toks[j+g.length]);
    const tx=t.slice(i,g[0].index).replace(i?/^\n/:/^/,'').replace(/\n$/,''); if(tx) h+=`<div class="mt">${fmtNota(tx)}</div>`;
    h+=g.length>1?`<div class="mrow">${g.map(m=>imgTag(m[1],m[2])).join('')}</div>`:imgTag(g[0][1],g[0][2]);
    const u=g[g.length-1]; i=u.index+u[0].length; j+=g.length; }
  const tx=t.slice(i).replace(i?/^\n/:/^/,''); if(tx) h+=`<div class="mt">${fmtNota(tx.replace(/\n$/,'\n\u200b'))}</div>`; return h;
}
function minhaHTML(id){

/* ===== Anotações no lugar (botão ✎ ao lado do marca-texto, atalho T) =====
   guardadas no mesmo campo "minha": bloco "@@nota|n|âncora" + texto, então sincronizam igual */
const AN_RE=/^@@nota\|(\d+)\|(.*)$/, AN_BLK='li,p,.vis,.opt,.q,.czq,.mac,.dgr,.uerj,.pega,.ctxh,.src,.tag,.fn';
let NT=false;
/* guarda o texto como ela digitou (linhas em branco incluídas); entre blocos vai 1 linha em branco de separação */
function anParse(s){ const base=[],l=[]; let cur=null;
  String(s||'').replace(/\r/g,'').split('\n').forEach(x=>{ const m=x.match(AN_RE); if(m){ if(!cur&&base.length&&base[base.length-1]==='') base.pop(); else if(cur&&cur.t.length&&cur.t[cur.t.length-1]==='') cur.t.pop(); cur={n:+m[1],a:m[2],t:[]}; l.push(cur); } else (cur?cur.t:base).push(x); });
  const tx=a=>{ const t=a.join('\n'); return t.trim()?t:''; };
  return {base:tx(base), l:l.map(o=>({n:o.n,a:o.a,t:tx(o.t)}))}; }
const anJoin=p=>[p.base,...p.l.filter(o=>o.t&&o.t.trim()).map(o=>`@@nota|${o.n}|${o.a}\n${o.t}`)].filter(x=>x&&x.trim()).join('\n\n');
function anTxt(b){ const c=b.cloneNode(true); c.querySelectorAll('.anot'+(b.tagName==='LI'?',ul':'')).forEach(x=>x.remove());
  let t=c.textContent.replace(/\s+/g,' ').trim(); if(!t){ const im=b.querySelector('img'); t=im?'img:'+(im.getAttribute('src')||'').slice(-40):''; } return t.slice(0,60); }
const anBlocos=root=>[...root.querySelectorAll(AN_BLK)].filter(b=>!b.closest('.anot,.mbx')&&b.closest('[data-an]')===root);
function anInserir(root,blk,el){
  if(!blk){ const m=root.querySelector('.mbx'); if(m) m.prepend(el); else root.appendChild(el); return; }
  if(blk.tagName==='LI'){ const ul=[...blk.children].find(x=>x.tagName==='UL'); ul?blk.insertBefore(el,ul):blk.appendChild(el); }
  else if(blk.matches('.fn')) blk.closest('.vis').after(el); else blk.after(el);
}
/* cada anotação é uma "zona" própria do marca-texto (chave = card + texto da nota) */
const hashT=t=>{ let h=5381; for(const ch of String(t)) h=((h<<5)+h+ch.codePointAt(0))|0; return (h>>>0).toString(36); };
/* dono da anotação: card (campo "minha") ou CONTEXTO do tema ("an:ctx-…", vale para todos os cards que mostram esse contexto; sincroniza junto com o marca-texto) */
const anDoCtx=id=>String(id).startsWith('an:');
const anGet=id=>anDoCtx(id)?((S.marks[id]||{}).txt||''):((BYID[id]||{}).minha||'');
function anSet(id,t){ if(anDoCtx(id)){ S.marks[id]={l:[],txt:t,u:Date.now()}; save(); } else { S.minha[id]=t; save(); reaplicar(); syncEdits(); } }
/* nota antiga de card que foi feita dentro do contexto → passa a ser nota do contexto */
function anMigrar(root,p){
  const subs=[...root.querySelectorAll('[data-an^="an:"]')]; if(!subs.length) return false; let mov=false;
  p.l.forEach(o=>{ if(!o.t||!o.a||o.mov) return; for(const sr of subs){ const bl=anBlocos(sr).filter(b=>anTxt(b)===o.a); if(!bl.length) continue;
    const cid=sr.dataset.an, q=anParse(anGet(cid)); q.l.push({n:Math.min(o.n||0,bl.length-1),a:o.a,t:o.t}); anSet(cid,anJoin(q)); o.mov=1; mov=true; break; } });
  if(!mov) return false; const id=root.dataset.an; p.l=p.l.filter(o=>!o.mov); anSet(id,anJoin(p)); return true; }
function pintarAnots(){
  document.querySelectorAll('[data-an]').forEach(root=>{
    const id=root.dataset.an, raw=anGet(id), p=anParse(raw);
    if(root.dataset.av!==raw){ root.querySelectorAll('.anot:not(.edit)').forEach(x=>{ if(x.closest('[data-an]')===root) x.remove(); }); root.dataset.av=raw; }

const GH_API='https://api.github.com/repos/jaaacked-07/jaaackestude.uerj-cards/contents/data/notas.json';
const ghTok=()=>{try{return localStorage.getItem(LS+'.gh')||''}catch(e){return ''}};

async function ghTexto(url,j,tk){
  if(j.content&&j.encoding==='base64') return dec(j.content);
  const r=await fetch(url+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github.raw'},cache:'no-store'});
  if(!r.ok) throw new Error(r.status); return await r.text(); }
async function ghGet(tk){

  if(!r.ok) throw new Error(r.status);
  const j=await r.json(); const d=JSON.parse(await ghTexto(GH_API,j,tk));

}
async function ghPut(tk,data,sha){

      const mudou=mergeProg(Rm); saveLocal(); if(Extras()) reaplicar();

/* ===== Chave criptografada com a senha do app ===== */
const GH_CHAVE=GH_API.replace('notas.json','chave.json');
const b64u=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derivar(senha,salt,iter){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function cifrar(tok,senha){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iter=310000;
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await derivar(senha,salt,iter),new TextEncoder().encode(tok));
  return {v:1,iter,salt:b64u(salt),iv:b64u(iv),ct:b64u(ct)};
}
async function decifrar(o,senha){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},await derivar(senha,ub64(o.salt),o.iter),ub64(o.ct));
  return new TextDecoder().decode(pt);
}
async function salvarChaveCifrada(tok,senha){
  const obj=await cifrar(tok,senha);
  const g=await fetch(GH_CHAVE+'?ref=main&t='+Date.now(),{headers:ghH(tok),cache:'no-store'});
  const sha=g.ok?(await g.json()).sha:null;
  const w=await fetch(GH_CHAVE,{method:'PUT',headers:{...ghH(tok),'Content-Type':'application/json'},body:JSON.stringify({message:'Chave protegida por senha',content:enc(JSON.stringify(obj)),branch:'main',...(sha?{sha}:{})})});
  if(!w.ok) throw new Error(w.status);
}

function comprimir(file){return new Promise((res,rej)=>{
  const fr=new FileReader(); fr.onerror=rej;
  fr.onload=()=>{const im=new Image(); im.onerror=rej; im.onload=()=>{
    const M=1100, k=Math.min(1,M/Math.max(im.width,im.height)), c=document.createElement('canvas');
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',0.78));}; im.src=fr.result;};
  fr.readAsDataURL(file);
})}

async function subirImg(nid,idx,dataUrl){

}

const pc=(a,t)=>t?Math.round(a/t*100):null;
const dBR=d=>d.split('-').reverse().map((x,i)=>i===2?x.slice(2):x).join('/');
function grafico(L){
  const ult=k=>L.filter(s=>s[k]!=null), dl=k=>{const a=ult(k);return a.length>1?a[a.length-1][k]-a[a.length-2][k]:null};
  const head=(k,nome,cor)=>{const a=ult(k); if(!a.length) return ''; const v=a[a.length-1][k], d=dl(k);
    return `<div class="kpi"><span class="kn"><i style="background:${cor}"></i>${nome}</span><span class="kv">${v}<small>%</small></span>${d!=null?`<span class="kd ${d>0?'up':d<0?'dn':''}">${d>0?'▲':d<0?'▼':'•'} ${Math.abs(d)} p.p. <span class="kvs">vs. anterior</span></span>`:''}</div>`};
  const topo=`<div class="kpis">${head('g','Simulado','var(--wine)')}${head('u','UERJ','var(--rose)')}</div>`;
  if(L.length<2) return `<div class="chart">${topo}<p class="mute small" style="text-align:center;padding:10px 0 6px">A curva de evolução aparece a partir do 2º simulado.</p></div>`;
  const vs=L.flatMap(s=>[s.g,s.u]).filter(v=>v!=null), lo=Math.max(0,Math.floor((Math.min(...vs)-10)/10)*10), hi=100;
  const W=320,H=150,pl=8,pr=30,pt=10,pb=22, x=i=>pl+i*(W-pl-pr)/(L.length-1), y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const ticks=[lo,Math.round((lo+hi)/2/5)*5,hi];
  const serie=(k,cor,area)=>{const pts=L.map((s,i)=>[i,s[k]]).filter(p=>p[1]!=null); if(!pts.length) return '';
    const d=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1)).join(' ');
    const fill=area&&pts.length>1?`<path d="${d} L${x(pts[pts.length-1][0]).toFixed(1)} ${y(lo)} L${x(pts[0][0]).toFixed(1)} ${y(lo)} Z" fill="url(#gArea)"/>`:'';
    return fill+`<path d="${d}" fill="none" stroke="${cor}" stroke-width="${area?1.8:1.4}" stroke-linejoin="round" stroke-linecap="round"/>`+
      pts.map((p,i)=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="${i===pts.length-1?3.2:2}" fill="var(--card)" stroke="${cor}" stroke-width="1.5"/>`).join('');};
  const passo=Math.ceil(L.length/8);
  return `<div class="chart">${topo}<svg viewBox="0 0 ${W} ${H}" font-family="Inter,system-ui,sans-serif">
    <defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--wine)" stop-opacity=".16"/><stop offset="1" stop-color="var(--wine)" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1" ${v===lo?'':'stroke-dasharray="2 4"'}/><text x="${W-pr+6}" y="${y(v)+3}" font-size="9" fill="var(--mute)">${v}%</text>`).join('')}
    ${L.map((s,i)=>i%passo&&i!==L.length-1?'':`<text x="${x(i)}" y="${H-6}" font-size="9" fill="var(--mute)" text-anchor="middle">S${i+1}</text>`).join('')}
    ${serie('u','var(--rose)')}${serie('g','var(--wine)',true)}
  </svg></div>`;
}

function mapaDados(){

    m.n++; m.subs.add(c.sub); const x=S.srs[c.id]; if(x){ m.vis++; m.seen+=x.seen||0; m.wrong+=x.wrong||0; if(ehFraco(x)) m.fr++; } });

}

        t=t.split(l).join(p); delete c[l]; mudou=true; }

const normD=x=>normN(x).split(' ').map(w=>w.length<=3?w:w.replace(/ais$/,'al').replace(/eis$/,'el').replace(/oes$/,'ao').replace(/ns$/,'m').replace(/s$/,'')).join(' ');   // singular/plural
function resolverBaralho(a,t,v){
  v=v.trim(); const decks=[...new Set([...CARDS,...S.decks].filter(x=>x.area===a&&x.tema===t&&x.sub!=null).map(x=>x.sub))];
  const pre=x=>x.split(/\s+[-–—:]\s+|:\s+/)[0];
  const achar=n=>decks.find(d=>normD(d)===normD(n))||decks.find(d=>normD(pre(d))===normD(n));
  const ex=decks.find(d=>normD(d)===normD(v)); if(ex) return {sub:ex,ja:true};
  const m=v.match(/^(.+?)\s+[-–—]\s+(.+)$/)||v.match(/^(.+?):\s+(.+)$/);
  if(m){ const d=achar(m[1]); const st=m[2].trim(); if(d){ const j=subtemasDe(a,t,d).find(x=>norm(x)===norm(st)); return {sub:d,subt:j||st,ja:true}; } return {sub:m[1].trim(),subt:st,ja:false}; }

/* ===== Formatação de texto — a MESMA em todas as caixas de texto do app =====
   barra em cima da caixa + barra flutuante em cima do trecho selecionado.
   Marcas: **negrito**, __sublinhado__, {v}vermelho{/v}; "- " tópico; "  - " subtópico.
   PC: segure Ctrl (⌘ no Mac) e selecione outros trechos → todos ficam marcados e a formatação vale para todos. */
const FMT_BTN=[['b','<b>B</b>','Negrito (Ctrl+B)',''],['u','<u>S</u>','Sublinhado (Ctrl+U)',''],['r','','Vermelho','fr'],['k','','Preto (cor normal)','fk'],['li','•','Tópico',''],['sub','◦','Subtópico',''],['seta','→','Seta','']];
function barraFmtHTML(extra){ return `<div class="ftb" role="toolbar">${FMT_BTN.map(([k,h,t,c])=>`<button type="button" data-fx="${k}" class="${c}" title="${t}" aria-label="${t}">${h}</button>`).join('')}${extra||''}</div>`; }
const ehFmt=t=>!!(t&&t.tagName==='TEXTAREA'&&t.matches('textarea.ned,textarea.note')&&t.id!=='bt');
let MULTI={ta:null,r:[]};
const wrapLinhas=(s,o,c)=>s.split('\n').map(l=>{ const m=l.match(/^(\s*(?:[-•◦]\s+)?)(.*?)(\s*)$/); return m[2]?m[1]+o+m[2]+c+m[3]:l; }).join('\n');
function umFmt(v,a,b,f,n){
  const sel=v.slice(a,b), antes=v.slice(0,a), depois=v.slice(b);
  if(f==='li'||f==='sub'){ const ls=v.lastIndexOf('\n',a-1)+1, le=v.indexOf('\n',b), fim=le<0?v.length:le, pf=f==='li'?'- ':'  - ';
    const novo=v.slice(ls,fim).split('\n').map(l=>pf+l.replace(/^\s*[-•◦]\s+/,'')).join('\n'); return {v:v.slice(0,ls)+novo+v.slice(fim),a:ls+novo.length,b:ls+novo.length}; }
  if(f==='seta') return {v:antes+' → '+depois,a:a+3,b:a+3};
  if(f==='cz'||f==='czm'){ const ab=`{{c${n}::`; return sel?{v:antes+ab+sel+'}}'+depois,a:a+ab.length+sel.length+2,b:a+ab.length+sel.length+2}:{v:antes+ab+'}}'+depois,a:a+ab.length,b:a+ab.length}; }
  if(f==='k'){ const s2=sel.replace(/\{\/?v\}/g,''), ab=antes.lastIndexOf('{v}')>antes.lastIndexOf('{/v}');
    return {v:antes+(ab?'{/v}':'')+s2+(ab&&!/^\{\/v\}/.test(depois)?'{v}':'')+depois,a:a+(ab?4:0),b:a+(ab?4:0)+s2.length}; }
  const [o,c]=f==='b'?['**','**']:f==='u'?['__','__']:['{v}','{/v}'];
  if(!sel) return {v:antes+o+c+depois,a:a+o.length,b:a+o.length};
  if(sel.startsWith(o)&&sel.endsWith(c)&&sel.length>=o.length+c.length){ const t=sel.slice(o.length,sel.length-c.length); return {v:antes+t+depois,a,b:a+t.length}; }
  if(antes.endsWith(o)&&depois.startsWith(c)) return {v:antes.slice(0,-o.length)+sel+depois.slice(c.length),a:a-o.length,b:b-o.length};
  const w=sel.includes('\n')?wrapLinhas(sel,o,c):o+sel+c;   // várias linhas: marca linha por linha (o card lê linha a linha)

function aplicarFmt(ta,f){

  const ns=czNums(ta.value), base=f==='czm'&&ns.length?Math.max(...ns):(ns.length?Math.max(...ns)+1:1), asc=rs.slice().sort((x,y)=>x[0]-y[0]);

}

function limparMulti(){ MULTI={ta:null,r:[]}; const o=$('#fml'); if(o) o.remove(); }
const MIRROR_P=['boxSizing','width','height','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderRightWidth','borderBottomWidth','borderLeftWidth','borderTopStyle','borderRightStyle','borderBottomStyle','borderLeftStyle','fontFamily','fontSize','fontWeight','fontStyle','letterSpacing','lineHeight','textTransform','wordSpacing','textIndent','tabSize'];

  const v=ta.value, rs=MULTI.r.slice().sort((x,y)=>x[0]-y[0]); let h='',i=0;

/* barra flutuante em cima do trecho selecionado */
let FLUT_TA=null;
function coordTA(ta,pos){ const d=document.createElement('div'); espelho(ta,d); d.style.height='auto'; Object.assign(d.style,{position:'absolute',visibility:'hidden',top:'0',left:'-9999px'});
  d.textContent=ta.value.slice(0,pos); const sp=document.createElement('span'); sp.textContent=ta.value.slice(pos,pos+1)||'.'; d.appendChild(sp); document.body.appendChild(d);

  if(!ok){ if(f) f.classList.remove('on'); FLUT_TA=null; return; }

  if(FLUT_TA!==ta){ const bar=ta.previousElementSibling&&ta.previousElementSibling.classList.contains('ftb')?ta.previousElementSibling:(ta.closest('.anot.edit')||{}).querySelector?.('.ftb');
    f.innerHTML=(bar?[...bar.querySelectorAll('[data-fx]')].filter(b=>b.dataset.fx!=='img').map(b=>b.outerHTML).join(''):barraFmtHTML().replace(/^<div[^>]*>|<\/div>$/g,'')); FLUT_TA=ta; }

/* ===== Confete ===== */
function confete(n){
  const cv=$('#cf'),ctx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cor=['#7A2E3B','#C9967A','#E8C4B0','#D98C9A','#B7822F'];
  const p=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*80,y:H*.38,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*6+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cor[Math.random()*cor.length|0]}));
  let t=0;CFSTOP=false;(function f(){if(CFSTOP){ctx.clearRect(0,0,W,H);return}ctx.clearRect(0,0,W,H);p.forEach(q=>{q.vy+=.32;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);ctx.restore()});if(++t<120)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})();
}
