<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UERJ Cards">
<title>UERJ Cards</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F2;--card:#FFFFFF;--ink:#2A1E21;--mute:#8C7F80;--line:#EFE6DD;
  --wine:#7A2E3B;--wine-soft:#F5E9EA;--rose:#C9967A;--rose-soft:#F7EEE7;
  --ok:#3F7D5C;--ok-soft:#E7F2EB;--bad:#B4443F;--bad-soft:#F8E8E6;--mid:#B7822F;--mid-soft:#F8F0E2;
  --r:18px;--shadow:0 1px 2px rgba(60,30,30,.04),0 8px 24px rgba(60,30,30,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1416;--card:#251C1F;--ink:#F3EAE4;--mute:#A6989A;--line:#3A2E31;
  --wine:#E3A3AE;--wine-soft:#3A2429;--rose:#D9AE93;--rose-soft:#33282A;
  --ok:#8CCBA6;--ok-soft:#203229;--bad:#EE9A94;--bad-soft:#3A2321;--mid:#E3BC78;--mid-soft:#3A3020;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 24px rgba(0,0,0,.25);
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea{font:inherit;color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px}
.serif{font-family:Fraunces,Georgia,serif;font-weight:500;letter-spacing:-.01em}
.mute{color:var(--mute)}
.small{font-size:13px}
.hide{display:none!important}

/* home */
.hello{font-size:15px;color:var(--mute);margin:8px 0 2px}
.count{font-size:44px;line-height:1.1}
.count small{display:block;font:500 14px Inter,sans-serif;color:var(--mute);margin-top:6px;letter-spacing:0}
.ringbox{display:flex;justify-content:center;margin:34px 0 26px}
.ring{position:relative;width:188px;height:188px}
.ring svg{transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n{font-size:40px;line-height:1}
.ring .l{font-size:13px;color:var(--mute);margin-top:6px}
.btn{display:block;width:100%;padding:17px;border-radius:16px;background:var(--wine);color:#fff;font-weight:600;font-size:17px;box-shadow:var(--shadow);transition:transform .12s}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#1B1416}}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--wine);box-shadow:none;border:1.5px solid var(--line);font-weight:500;font-size:15px;padding:13px}
.stats{display:flex;justify-content:center;gap:26px;margin-top:22px;font-size:14px;color:var(--mute)}
.stats b{color:var(--ink);font-weight:600}
.linkrow{text-align:center;margin-top:28px}
.link{color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.done{text-align:center;padding:6px 0 4px}
.done .serif{font-size:22px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--mute);padding:6px 16px;border-radius:12px;position:relative}
nav button.on{color:var(--wine)}
nav svg{width:24px;height:24px}
.dot{position:absolute;top:4px;right:12px;min-width:8px;height:8px;border-radius:8px;background:var(--bad)}

/* session */
.sess{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sbar{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:520px;width:100%;margin:0 auto}
.sbar .x{width:32px;height:32px;display:grid;place-items:center;color:var(--mute);border-radius:10px}
.prog{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--wine);border-radius:6px;transition:width .35s ease}
.combo{font-size:13px;color:var(--rose);font-weight:600;min-width:34px;text-align:right}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sbody .wrap{padding-top:6px;padding-bottom:140px}
.tag{font-size:12px;color:var(--mute);letter-spacing:.04em;text-transform:uppercase;margin-bottom:12px}
.q{font-size:23px;line-height:1.3}
.ans{margin-top:22px;animation:up .28s ease}
.ans p{font-size:17px}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pega{margin-top:16px;background:var(--mid-soft);border-radius:14px;padding:12px 14px;font-size:14.5px}
.pega b{color:var(--mid)}
.src{margin-top:14px;font-size:12px;color:var(--mute)}
.sfoot{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:0 -10px 20px -12px rgba(60,30,30,.18)}
.sfoot:empty,.sfoot .in:empty{box-shadow:none}
.sfoot .in{max-width:520px;margin:0 auto}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate button{padding:15px 6px;border-radius:14px;font-weight:600;font-size:15px}
.r0{background:var(--bad-soft);color:var(--bad)}.r1{background:var(--mid-soft);color:var(--mid)}.r2{background:var(--ok-soft);color:var(--ok)}
.why{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;animation:up .2s ease}
.why span{font-size:12.5px;color:var(--mute);width:100%;text-align:center}
.chip{padding:8px 13px;border-radius:20px;border:1.5px solid var(--line);font-size:14px}
.chip.on{border-color:var(--wine);background:var(--wine-soft);color:var(--wine)}

/* quiz */
.opts{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 15px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:16px;display:flex;gap:12px;align-items:flex-start;transition:background .2s}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--mute)}
.opt .c{display:block;font-size:14px;color:var(--mute);margin-top:6px}
.opt.ok{background:var(--ok-soft)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--bad-soft)}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

/* visuals */
.vis{margin-top:18px}
table.t{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;font-size:14px}
.t th{text-align:left;font-weight:600;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line)}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t td:first-child{font-weight:600;color:var(--wine)}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.fn{background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:9px 16px;font-size:14.5px;text-align:center;min-width:60%}
.fr{display:flex;gap:8px;width:100%;justify-content:center}.fr .fn{min-width:0;flex:1}
.fa{width:2px;height:16px;background:var(--rose);position:relative;margin:2px 0 6px}
.fa:after{content:"";position:absolute;bottom:-5px;left:-4px;border:5px solid transparent;border-top-color:var(--rose)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vs .s{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:14px;text-align:center}
.vs .s h4{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:17px;color:var(--wine);margin-bottom:6px}
.vs .s div{font-size:14px}
.vs .o{align-self:center;font-size:12px;color:var(--mute);font-weight:600}
.li{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:6px 14px}
.li div{padding:9px 0 9px 18px;border-bottom:1px solid var(--line);position:relative;font-size:15px}
.li div:last-child{border-bottom:0}
.li div:before{content:"";position:absolute;left:2px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--rose)}
.li div.hl{color:var(--wine);font-weight:600}.li div.hl:before{background:var(--wine)}
.grp{display:flex;flex-direction:column;gap:12px}
.grp .g h5{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin-bottom:7px}
.grp .g .cs{display:flex;flex-wrap:wrap;gap:6px}
.grp .g .cs span{background:var(--rose-soft);border-radius:10px;padding:5px 10px;font-size:14px}
.vsvg{background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:12px}
.vsvg svg{display:block;width:100%;height:auto}
.vimg{background:var(--card);box-shadow:var(--shadow);border-radius:14px;overflow:hidden}
.vimg img{display:block;width:100%;height:auto}
.vcap{font-size:12.5px;color:var(--mute);padding:8px 12px}
.ans p+p{margin-top:10px}

/* end */
.end{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.end .big{font-size:34px;margin:14px 0 6px}
.end .xp{font-size:15px;color:var(--rose);font-weight:600;margin-top:16px}
.end .row{display:flex;gap:28px;margin:26px 0 34px;font-size:14px;color:var(--mute)}
.end .row b{display:block;font-size:22px;color:var(--ink);font-family:Fraunces,Georgia,serif;font-weight:500}
.end .btn{max-width:320px}
.lvl{font-size:13px;background:var(--wine-soft);color:var(--wine);border-radius:20px;padding:5px 12px;margin-top:12px;font-weight:600}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:30}

/* pages */
h2.serif{font-size:28px;margin:6px 0 18px}
.empty{text-align:center;padding:50px 10px;color:var(--mute)}
.empty .serif{font-size:20px;color:var(--ink);margin-bottom:6px}
.bars{display:flex;flex-direction:column;gap:9px;margin-bottom:24px}
.bar{display:grid;grid-template-columns:96px 1fr 26px;gap:10px;align-items:center;font-size:14px}
.bar .b{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--bad);border-radius:8px}
.bar .v{text-align:right;color:var(--mute);font-size:13px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin:22px 0 8px}
.rows{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);text-align:left;width:100%;font-size:15px}
.rowi:last-child{border-bottom:0}
.rowi .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowi .pill{font-size:12px;border-radius:10px;padding:2px 8px;background:var(--bad-soft);color:var(--bad);flex:none}
.rowi .pill.ok{background:var(--ok-soft);color:var(--ok)}
.rowi.dim{opacity:.55}
textarea.note{width:100%;min-height:150px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font-size:15px;resize:vertical;outline:none}
textarea.note:focus{border-color:var(--rose)}
.nt{padding:13px 15px;border-bottom:1px solid var(--line);font-size:14.5px}
.nt:last-child{border-bottom:0}
.nt .d{font-size:12px;color:var(--mute);margin-bottom:3px;display:flex;justify-content:space-between}
.nt .p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:34px;display:flex;justify-content:center;gap:18px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:15;background:rgba(20,10,12,.35);display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
@keyframes fd{from{opacity:0}}
.sheet .pn{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 16px}
.star{float:right;font-size:20px;line-height:1;color:var(--mute);padding:0 2px;margin-top:-3px}
.star.on{color:var(--mid)}
.mine{margin-top:16px;border-left:3px solid var(--rose);padding:2px 0 2px 12px}
.mine .mh{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--rose);font-weight:600;margin-bottom:3px}
.mine .mt{font-size:16px;white-space:pre-wrap}
.addn{margin-top:14px;font-size:14px;color:var(--rose);font-weight:500}
.mine textarea,.ned{width:100%;min-height:80px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-size:15px;outline:none;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.tm{font-size:13px;color:var(--mute);margin:10px 0 6px}
.srch{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;font:inherit;font-size:15px;color:var(--ink);outline:none;margin-bottom:10px}
.nb{font-size:11.5px;font-weight:600;color:var(--wine);text-transform:uppercase;letter-spacing:.05em}
details.sent summary{cursor:pointer;color:var(--mute);font-size:14px;margin-top:22px;list-style:none}
.sel{width:100%;display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:13px 15px;text-align:left;margin-bottom:10px}
.sel .sl{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;font-weight:600;width:92px;flex:none}
.sel .sv{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel .ch{color:var(--mute);font-size:13px}
.opi{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left;font-size:15.5px;width:100%}
.opi .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;font-size:13px;color:#fff}
.opi.rd .bx{border-radius:50%}
.opi.on .bx{background:var(--wine);border-color:var(--wine)}
.opi .ct{margin-left:auto;color:var(--mute);font-size:13px}
.opg{display:flex;justify-content:space-between;align-items:center;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin:18px 0 0}
.opg button{font-size:12px;color:var(--wine);text-transform:none;letter-spacing:0;font-weight:500}
.tacts{float:right;display:flex;gap:2px;margin-top:-5px}
.tacts .star{float:none;margin:0}
.pen{color:var(--mute);font-size:15px;padding:2px 6px;opacity:.75}
.rowi .ct{color:var(--mute);font-size:13px;flex:none}
.rowi .chv{color:var(--mute);font-size:12px;flex:none;transition:transform .2s}
.rowi.op .chv{transform:rotate(90deg)}
.lv1{padding-left:30px!important;background:color-mix(in srgb,var(--card) 55%,var(--bg))}
.lv2{padding-left:44px!important;font-size:14.5px!important;background:color-mix(in srgb,var(--card) 30%,var(--bg))}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;animation:up .2s}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-p="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="13" height="15" rx="2.5"/><path d="M8 3h10a2 2 0 0 1 2 2v12"/></svg>Hoje</button>
  <button data-p="estudar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Estudar</button>
  <button data-p="erros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 11h6M9 15h4"/></svg>Erros<i class="dot hide" id="dotE"></i></button>
  <button data-p="anotar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>Anotar</button>
</nav>
<canvas id="cf"></canvas>

<script>
/* ===== Config ===== */
const NOME='Jacke';
const PROVA='2026-11-01';
const VESPERA='2026-10-31';
const CAP_TOTAL=30, CAP_REV=22, CAP_NOVOS=15;
const LS='uerjcards.v1';

/* ===== Datas ===== */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>iso(new Date());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);

/* ===== Estado ===== */
let S;
try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){S={}}
const DEV=(()=>{try{let d=localStorage.getItem(LS+'.dev');if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem(LS+'.dev',d)}return d}catch(e){return 'x'}})();
function fixS(){S.srs=S.srs||{}; S.xp=S.xp||0; S.streak=S.streak||{n:0,last:null}; S.notas=S.notas||[]; S.extra=S.extra||[]; S.plan=S.plan||null; S.fav=S.fav||{}; S.minha=S.minha||{}; S.ren=S.ren||{tema:{},sub:{}}; S.edit=S.edit||{}; S.oculto=S.oculto||{};
  S.xpDev=S.xpDev||{}; if(S.xp&&!Object.keys(S.xpDev).length) S.xpDev[DEV]=S.xp;
  S.dias=S.dias||{}; if(S.streak&&S.streak.last&&!Object.keys(S.dias).length) for(let i=0;i<S.streak.n;i++) S.dias[addD(S.streak.last,-i)]=1;
  S.notasDel=S.notasDel||{};
  if(typeof recalc==='function') recalc();}
fixS();
const saveLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const save=()=>{saveLocal();if(typeof agendarSync==='function')agendarSync()};

/* ===== Cards ===== */
let CARDS=[], BYID={}, RAW={}, LASTBASE=[];
const dTema=c=>S.ren.tema[c.tema]||c.tema;
const dSub=c=>S.ren.sub[c.tema+'|'+c.sub]||c.sub;
function setCards(base){
  LASTBASE=base||[];
  const m={};
  LASTBASE.forEach(c=>m[c.id]=c);
  (S.extra||[]).forEach(c=>m[c.id]=c);
  RAW=m; const out={};
  Object.values(m).forEach(c0=>{ if(oculto(c0)) return;
    const c={...c0,...(S.edit[c0.id]||{})}; c.tema=dTema(c0); c.sub=dSub(c0);
    c.fav = c0.id in S.fav ? !!S.fav[c0.id] : !!c0.fav;
    c.minha = c0.id in S.minha ? S.minha[c0.id] : (c0.minha||'');
    if(!c.pegadinha) delete c.pegadinha;
    out[c.id]=c; });
  CARDS=Object.values(out); BYID=out;
}
const reaplicar=()=>setCards(LASTBASE);

/* ===== Agenda (curta até a prova) ===== */
const ANTES=[1,2,3,5,6];   // dias por caixa antes da prova
const DEPOIS=[1,3,7,14,30];
function proximo(box){
  const h=hoje(), lad=h<PROVA?ANTES:DEPOIS;
  let d=addD(h,lad[Math.min(box,lad.length-1)]);
  if(h<VESPERA && d>VESPERA){ d = (box%2? addD(VESPERA,-1):VESPERA); if(d<=h) d=VESPERA; }
  return d;
}
function rating(id,r,tipoErro){
  const s=S.srs[id]||{box:0,seen:0,wrong:0};
  s.seen++; s.last=hoje(); s.lr=r; s.t=Date.now();
  if(r===0){s.box=0; s.wrong++; if(tipoErro) s.et=tipoErro; s.due=addD(hoje(),1);}
  else if(r===1){s.box=Math.max(0,Math.min(s.box,1)); s.due=addD(hoje(),1);}
  else {s.box=Math.min(s.box+1,4); s.due=proximo(s.box);}
  S.srs[id]=s;
}
function novos(){return CARDS.filter(c=>!S.srs[c.id])}
function vencidos(){
  const h=hoje();
  return CARDS.filter(c=>S.srs[c.id]&&S.srs[c.id].due<=h)
    .sort((a,b)=>(S.srs[b.id].lr===0)-(S.srs[a.id].lr===0)||S.srs[a.id].due.localeCompare(S.srs[b.id].due));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function montarPlano(){
  const h=hoje();
  if(S.plan&&S.plan.date===h){
    // cards que chegaram hoje entram no plano, respeitando o teto
    const no=new Set(S.plan.ids), nvp=S.plan.nv||0;
    const vaga=Math.min(CAP_NOVOS-nvp, CAP_TOTAL-S.plan.ids.length);
    if(vaga>0){const add=novos().filter(c=>!no.has(c.id)).slice(0,vaga).map(c=>c.id); if(add.length){S.plan.ids.push(...add);S.plan.nv=nvp+add.length;save()}}
    return;
  }
  const rev=shuffle(vencidos().slice(0,CAP_REV)).map(c=>c.id);
  const nv=novos().slice(0,Math.min(CAP_NOVOS,CAP_TOTAL-rev.length)).map(c=>c.id);
  S.plan={date:h,ids:[...nv,...rev],done:[],nv:nv.length};
  save();
}
function pendentes(){return S.plan.ids.filter(id=>BYID[id]&&!S.plan.done.includes(id))}
function extrasDisponiveis(){
  const no=new Set(S.plan.ids);
  return novos().filter(c=>!no.has(c.id)).length + vencidos().filter(c=>!no.has(c.id)).length;
}
function adicionarMais(n){
  const no=new Set(S.plan.ids);
  const add=[...novos(),...vencidos()].filter(c=>!no.has(c.id)).slice(0,n).map(c=>c.id);
  S.plan.ids.push(...add); save(); return add;
}

/* ===== Recompensa ===== */
const nivel=xp=>Math.floor(Math.sqrt(xp/60))+1;
function marcarStreak(){ S.dias[hoje()]=1; recalc(); }
function addXP(n){ S.xpDev[DEV]=(S.xpDev[DEV]||0)+n; recalc(); }
function recalc(){
  S.xp=Object.values(S.xpDev||{}).reduce((a,b)=>a+b,0);
  const ds=Object.keys(S.dias||{}).sort(); const last=ds[ds.length-1]||null; let n=0;
  if(last){ n=1; while(S.dias[addD(last,-n)]) n++; }
  S.streak={n,last};
}

  return Object.keys(t).sort(abc).map(m=>({m,subs:Object.keys(t[m]).sort(abc).map(su=>({su,cards:t[m][su]}))}));

/* ===== Envio automático pro GitHub ===== */
const GH_API='https://api.github.com/repos/jaaacked-07/jaaackestude.uerj-cards/contents/data/notas.json';
const ghTok=()=>{try{return localStorage.getItem(LS+'.gh')||''}catch(e){return ''}};
const enc=t=>btoa(unescape(encodeURIComponent(t)));
const dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const ghH=tk=>({Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'});
async function ghGet(tk){
  const r=await fetch(GH_API+'?ref=main&t='+Date.now(),{headers:ghH(tk),cache:'no-store'});
  if(r.status===404) return {sha:null,data:{pendentes:[],processadas:[]}};
  if(!r.ok) throw new Error(r.status);
  const j=await r.json(); const d=JSON.parse(dec(j.content));
  d.pendentes=d.pendentes||[]; d.processadas=d.processadas||[];
  return {sha:j.sha,data:d};
}
async function ghPut(tk,data,sha){
  const body={message:'Anotações novas do app',content:enc(JSON.stringify(data,null,2)+'\n'),branch:'main'};
  if(sha) body.sha=sha;
  const r=await fetch(GH_API,{method:'PUT',headers:{...ghH(tk),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status);
}
const GH_CARDS=GH_API.replace('notas.json','cards.json');
async function ghModF(url,fn){
  const tk=ghTok();
  for(let i=0;i<2;i++){
    try{
      const r=await fetch(url+'?ref=main&t='+Date.now(),{headers:ghH(tk),cache:'no-store'}); if(!r.ok) throw new Error(r.status);
      const j=await r.json(); const d=JSON.parse(dec(j.content)); fn(d);
      const w=await fetch(url,{method:'PUT',headers:{...ghH(tk),'Content-Type':'application/json'},body:JSON.stringify({message:'Edições feitas no app',content:enc(JSON.stringify(d,null,2)+'\n'),branch:'main',sha:j.sha})});
      if(!w.ok) throw new Error(w.status); return d;
    }catch(e){ if(i) throw e; }
  }
}
let SYNC=false;
const temOverride=()=>['edit','fav','minha','oculto'].some(k=>Object.keys(S[k]).length)||Object.keys(S.ren.tema).length||Object.keys(S.ren.sub).length;
async function syncEdits(){
  if(!ghTok()||SYNC||!temOverride()) return; SYNC=true;
  const snap=JSON.parse(JSON.stringify({edit:S.edit,fav:S.fav,minha:S.minha,oculto:S.oculto,ren:S.ren}));
  try{

      d.cards.forEach(c=>{
        const k=c.tema+'|'+c.sub;
        if(snap.edit[c.id]) Object.assign(c,snap.edit[c.id]);
        if(!c.pegadinha) delete c.pegadinha;
        if(snap.ren.sub[k]) c.sub=snap.ren.sub[k];
        if(snap.ren.tema[c.tema]) c.tema=snap.ren.tema[c.tema];
        [['fav',v=>!!v],['oculto',v=>!!v],['minha',v=>v||'']].forEach(([f,cv])=>{ if(c.id in snap[f]){const v=cv(snap[f][c.id]); if(v) c[f]=v; else delete c[f];} });
      });

    ['edit','fav','minha','oculto'].forEach(f=>Object.keys(snap[f]).forEach(id=>{ if(noRepo.has(id)&&igual(S[f][id],snap[f][id])) delete S[f][id]; }));
    ['tema','sub'].forEach(f=>Object.keys(snap.ren[f]).forEach(k=>{ if(S.ren[f][k]===snap.ren[f][k]) delete S.ren[f][k]; }));
    localStorage.setItem(LS+'.cache',JSON.stringify(novo)); save(); setCards(novo.cards);

/* ===== Sincronizar progresso entre aparelhos ===== */
const GH_PROG=GH_API.replace('notas.json','progresso.json');
const progSnap=()=>({srs:S.srs,xpDev:S.xpDev,dias:S.dias,notas:S.notas,notasDel:S.notasDel,plan:S.plan,extra:S.extra});
function mergeProg(R){
  if(!R) return false; const antes=JSON.stringify(progSnap());
  for(const id in R.srs||{}){const a=S.srs[id],b=R.srs[id]; if(!a||(b.t||0)>(a.t||0)) S.srs[id]=b;}
  for(const d in R.xpDev||{}) S.xpDev[d]=Math.max(S.xpDev[d]||0,R.xpDev[d]);
  Object.assign(S.dias,R.dias||{}); Object.assign(S.notasDel,R.notasDel||{});
  const m={}; [...S.notas,...(R.notas||[])].forEach(n=>{const o=m[n.id]; if(!o){m[n.id]={...n};return} const k=(n.u||n.id)>(o.u||o.id)?{...n}:o; k.env=!!(o.env||n.env); m[n.id]=k;});
  S.notas=Object.values(m).filter(n=>!S.notasDel[n.id]).sort((a,b)=>a.id-b.id);
  if(R.plan){ if(!S.plan||R.plan.date>S.plan.date) S.plan=R.plan;
    else if(R.plan.date===S.plan.date){ S.plan.ids=[...new Set([...S.plan.ids,...R.plan.ids])]; S.plan.done=[...new Set([...S.plan.done,...R.plan.done])]; S.plan.nv=Math.max(S.plan.nv||0,R.plan.nv||0);} }
  const ex={}; [...(S.extra||[]),...(R.extra||[])].forEach(c=>ex[c.id]=c); S.extra=Object.values(ex);
  recalc();
  return JSON.stringify(progSnap())!==antes;
}
let PSYNC=false, PTIMER=null, PMUDOU=false;
function agendarSync(){ PMUDOU=true; clearTimeout(PTIMER); if(!SS) PTIMER=setTimeout(syncProg,4000); }
async function syncProg(){
  clearTimeout(PTIMER);
  const tk=ghTok(); if(!tk||PSYNC||SS) return; PSYNC=true;
  for(let i=0;i<2;i++){
    try{
      const r=await fetch(GH_PROG+'?ref=main&t='+Date.now(),{headers:ghH(tk),cache:'no-store'});
      let sha=null,Rm=null;
      if(r.ok){const j=await r.json(); sha=j.sha; Rm=JSON.parse(dec(j.content));} else if(r.status!==404) throw new Error(r.status);
      const mudou=mergeProg(Rm); saveLocal(); if(Extras()) reaplicar();
      const corpo=JSON.stringify(progSnap());
      if(!Rm||corpo!==JSON.stringify(Rm)){
        const w=await fetch(GH_PROG,{method:'PUT',headers:{...ghH(tk),'Content-Type':'application/json'},body:JSON.stringify({message:'Progresso',content:enc(corpo),branch:'main',...(sha?{sha}:{})})});
        if(!w.ok) throw new Error(w.status);
      }
      PMUDOU=false;
      if(mudou&&!SS&&!$('#sheet')) render();

    }catch(e){ if(i) break; }
  }
  PSYNC=false;
}

/* ===== Chave criptografada com a senha do app ===== */
const GH_CHAVE=GH_API.replace('notas.json','chave.json');
const b64u=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const ub64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function derivar(senha,salt,iter){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function cifrar(tok,senha){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iter=310000;
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await derivar(senha,salt,iter),new TextEncoder().encode(tok));
  return {v:1,iter,salt:b64u(salt),iv:b64u(iv),ct:b64u(ct)};
}
async function decifrar(o,senha){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},await derivar(senha,ub64(o.salt),o.iter),ub64(o.ct));
  return new TextDecoder().decode(pt);
}
async function salvarChaveCifrada(tok,senha){
  const obj=await cifrar(tok,senha);
  const g=await fetch(GH_CHAVE+'?ref=main&t='+Date.now(),{headers:ghH(tok),cache:'no-store'});
  const sha=g.ok?(await g.json()).sha:null;
  const w=await fetch(GH_CHAVE,{method:'PUT',headers:{...ghH(tok),'Content-Type':'application/json'},body:JSON.stringify({message:'Chave protegida por senha',content:enc(JSON.stringify(obj)),branch:'main',...(sha?{sha}:{})})});
  if(!w.ok) throw new Error(w.status);
}
async function buscarChave(){try{const r=await fetch('data/chave.json?t='+Date.now(),{cache:'no-store'});return r.ok?await r.json():null}catch(e){return null}}

  $('#sv').onclick=()=>{const t=$('#tx').value.trim();if(!t)return;S.notas.push({id:Date.now(),d:hoje(),t,env:false});save();$('#tx').value='';toast('Guardado');pAnotar();enviarPendentes()};
  const cp=$('#cp'); if(cp) cp.onclick=async()=>{
    const txt='UERJ Cards — comentários para virar cards ('+naoEnv.length+(naoEnv.length>1?' questões':' questão')+')\n\n'+naoEnv.map((n,i)=>`━━━━━━ QUESTÃO ${i+1} ━━━━━━\n${n.t}`).join('\n\n')+'\n\n━━━━━━ FIM ━━━━━━';
    try{await navigator.clipboard.writeText(txt)}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
    naoEnv.forEach(n=>n.env=true);save();toast('Copiado! Cole no chat do Claude.');pAnotar();
  };
  document.querySelectorAll('.nt').forEach(el=>el.onclick=()=>{
    const n=S.notas.find(x=>x.id==el.dataset.id);
    folha(`<div class="tag">${n.d.split('-').reverse().join('/')}</div><textarea class="note" id="ne">${esc(n.t)}</textarea>
      <button class="btn" id="ns" style="margin-top:12px">Salvar</button>
      <div class="foot"><button class="link" id="del" style="color:var(--bad)">apagar</button></div>`);
    $('#ns').onclick=async()=>{const t=$('#ne').value.trim();fecharFolha();if(!t||t===n.t)return;n.t=t;n.u=Date.now();save();pAnotar();
      if(n.env&&tk){try{await ghMod(d=>{const x=d.pendentes.find(p=>String(p.id)===String(n.id));if(x)x.t=t})}catch(e){toast('Sem internet — tente editar de novo depois')}}};
    $('#del').onclick=async()=>{ if(!(await confirmar('Apagar esta anotação?','Apagar')))return;
      S.notasDel[n.id]=1; S.notas=S.notas.filter(x=>x!==n);save();pAnotar();
      if(n.env&&tk){try{await ghMod(d=>{d.pendentes=d.pendentes.filter(p=>String(p.id)!==String(n.id))})}catch(e){}} };
  });
  $('#gh').onclick=abrirConexao;
  $('#imp').onclick=()=>{
    folha(`<div class="serif" style="font-size:20px;margin-bottom:10px">Importar cards</div><p class="mute small" style="margin-bottom:10px">Só use se o Claude te mandar um bloco de cards pra colar.</p><textarea class="note" id="ij"></textarea><button class="btn" id="ib" style="margin-top:12px">Importar</button>`);
    $('#ib').onclick=()=>{try{const j=JSON.parse($('#ij').value);const arr=Array.isArray(j)?j:j.cards;if(!Array.isArray(arr))throw 0;const ids=new Set(S.extra.map(c=>c.id));arr.forEach(c=>{if(c.id&&c.frente){if(ids.has(c.id))S.extra=S.extra.filter(x=>x.id!==c.id);S.extra.push(c)}});save();reaplicar();fecharFolha();toast(arr.length+' cards importados');render()}catch(e){toast('Não reconheci esse bloco')}};
  };
  $('#bk').onclick=()=>{
    folha(`<div class="serif" style="font-size:20px;margin-bottom:10px">Backup do progresso</div><p class="mute small" style="margin-bottom:12px">Pra levar seu progresso pra outro aparelho.</p>
      <button class="btn ghost" id="bx">Copiar meu progresso</button>
      <textarea class="note" id="bt" style="margin-top:14px;min-height:90px" placeholder="…ou cole aqui um progresso copiado"></textarea>
      <button class="btn" id="bi" style="margin-top:10px">Restaurar</button>`);
    $('#bx').onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){$('#bt').value=t}};
    $('#bi').onclick=()=>{try{const j=JSON.parse($('#bt').value);if(!j.srs)throw 0;confirmar('Substituir o progresso deste aparelho?','Substituir').then(ok=>{if(!ok)return;S=j;fixS();save();reaplicar();toast('Restaurado');render()})}catch(e){toast('Backup inválido')}};
  };
}

/* ===== Diálogos no visual do app ===== */
function confirmar(msg,ok='Confirmar',sub=''){return new Promise(res=>{
  folha(`<div class="serif" style="font-size:21px">${esc(msg)}</div>${sub?`<p class="mute small" style="margin-top:6px">${esc(sub)}</p>`:''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px"><button class="btn ghost" id="cn">Cancelar</button><button class="btn" id="cy" style="background:var(--bad)">${esc(ok)}</button></div>`);
  $('#cn').onclick=()=>{fecharFolha();res(false)}; $('#cy').onclick=()=>{fecharFolha();res(true)};
})}
function escolha(titulo,opcoes,atual,cb){
  folha(`<div class="serif" style="font-size:21px;margin-bottom:6px">${esc(titulo)}</div>${opcoes.map(o=>`<button class="opi rd ${o.v===atual?'on':''}" data-v="${o.v}"><span class="bx">${o.v===atual?'✓':''}</span>${esc(o.t)}</button>`).join('')}`);
  document.querySelectorAll('#sheet .opi').forEach(b=>b.onclick=()=>{fecharFolha();cb(b.dataset.v)});
}

/* ===== Folha ===== */
function folha(html){
  fecharFolha();
  const d=document.createElement('div');d.className='sheet';d.id='sheet';
  d.innerHTML=`<div class="pn"><div class="grab"></div>${html}</div>`;
  d.onclick=e=>{if(e.target===d)fecharFolha()};
  document.body.appendChild(d);
}
function fecharFolha(){const s=$('#sheet');if(s)s.remove()}

/* ===== Sessão ===== */
let SS=null, CFSTOP=false;
function ajustaPe(){const f=$('#sf'),w=$('#sw');if(f&&w)w.style.paddingBottom=(f.offsetHeight+40)+'px'}
new MutationObserver(()=>ajustaPe()).observe(document.body,{childList:true,subtree:true});
function sessao(ids,modo){
  ids=ids.filter(id=>BYID[id]); if(!ids.length) return;
  SS={unicos:ids.length,fila:ids.slice(),total:ids.length,feitos:0,xp:0,combo:0,maxCombo:0,acertos:0,modo,repetidos:new Set()};
  const el=document.createElement('div');el.className='sess';el.id='sess';
  el.innerHTML=`<div class="sbar"><button class="x" id="sx" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="prog"><i id="pg"></i></div><span class="combo" id="cb"></span></div><div class="sbody" id="sb"><div class="wrap" id="sw"></div></div><div class="sfoot"><div class="in" id="sf"></div></div>`;
  document.body.appendChild(el); document.body.style.overflow='hidden';
  $('#sx').onclick=sair;
  proximoCard();
}
function sair(){const e=$('#sess');if(e)e.remove();document.body.style.overflow='';SS=null;render();syncProg()}
function barra(){$('#pg').style.width=(SS.feitos/SS.total*100)+'%';$('#cb').textContent=SS.combo>=3?'×'+SS.combo:''}
function proximoCard(){
  barra();
  if(!SS.fila.length) return fim();
  const c=BYID[SS.fila[0]];
  $('#sb').scrollTop=0;
  const w=$('#sw'), f=$('#sf');
  w.innerHTML=tagHTML(c)+`<div class="q serif">${esc(c.frente)}</div><div id="ar"></div>`;
  if(c.tipo==='quiz'){
    $('#ar').innerHTML=`<div class="opts">${c.opcoes.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCDE'[i]}</span><span>${esc(o)}<span class="c hide">${esc((c.comentarios||[])[i]||'')}</span></span></button>`).join('')}</div>`;
    f.innerHTML='';
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i, ok=i===c.certa;
      document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;x.querySelector('.c').classList.remove('hide');if(j===c.certa)x.classList.add('ok');else if(j===i)x.classList.add('bad')});
      vib(ok?12:[20,40,20]);
      $('#ar').insertAdjacentHTML('beforeend',(c.pegadinha?`<div class="pega"><b>Pegadinha · </b>${esc(c.pegadinha)}</div>`:'')+minhaHTML(c.id));
      if(ok) f.innerHTML=`<button class="btn" id="nx">Continuar</button>`, $('#nx').onclick=()=>responder(c,2);
      else pedirMotivo(c);
    });
  } else {
    f.innerHTML=`<button class="btn" id="sh">Mostrar resposta</button>`;
    $('#sh').onclick=()=>{
      $('#ar').innerHTML=`<div class="ans">${paras(c.verso)}${visual(c.visual)}${c.pegadinha?`<div class="pega"><b>Pegadinha · </b>${esc(c.pegadinha)}</div>`:''}${minhaHTML(c.id)}</div>`;
      f.innerHTML=`<div class="rate"><button class="r0" data-r="0">Errei</button><button class="r1" data-r="1">Quase</button><button class="r2" data-r="2">Sabia</button></div>`;
      f.querySelectorAll('button').forEach(b=>b.onclick=()=>{const r=+b.dataset.r; if(r===0) pedirMotivo(c); else {vib(10);responder(c,r)}});
    };
  }
}
function pedirMotivo(c){
  const f=$('#sf');
  f.innerHTML=`<div class="why"><span>Por quê? (opcional)</span>${Object.keys(TIPOS).map(k=>`<button class="chip" data-t="${k}">${TIPOS[k]}</button>`).join('')}</div><button class="btn" id="nx">Continuar</button>`;
  let t=null;
  f.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{t=b.dataset.t;f.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))});
  $('#nx').onclick=()=>responder(c,0,t);
}
function responder(c,r,t){
  const id=SS.fila.shift();
  const repetido=SS.repetidos.has(id);
  if(!repetido && !(SS.modo==='livre' && r>0 && S.srs[id])) rating(id,r,t);
  if(r===0 && !repetido){SS.repetidos.add(id); SS.fila.splice(Math.min(3,SS.fila.length),0,id); SS.total++;}
  SS.feitos++;
  const ganho = r===2?10:r===1?6:3;
  SS.xp+=ganho; addXP(ganho);
  if(r===2){SS.combo++;if(!repetido)SS.acertos++;SS.maxCombo=Math.max(SS.maxCombo,SS.combo)} else SS.combo=0;
  if(SS.modo==='dia' && S.plan && !S.plan.done.includes(id) && !(r===0&&!repetido)) S.plan.done.push(id);
  save(); proximoCard();
}
function fim(){
  const lvAntes=nivel(S.xp-SS.xp);
  const diaFeito = SS.modo==='dia' && !pendentes().length;
  if(diaFeito){ addXP(20); SS.xp+=20; marcarStreak(); }
  save();
  const lv=nivel(S.xp);
  const e=document.createElement('div');e.className='end';e.id='end';
  e.innerHTML=`<div style="font-size:44px">${diaFeito?'🌷':'✓'}</div>
    <div class="big serif">${diaFeito?'Pendências do dia feitas':'Rodada concluída'}</div>
    <p class="mute">${FRASES[Math.random()*FRASES.length|0]}</p>
    <div class="xp">+${SS.xp} XP${diaFeito?' · bônus do dia incluso':''}</div>
    ${lv>lvAntes?`<div class="lvl">Subiu para o nível ${lv} ✦</div>`:''}
    <div class="row"><span><b>${Math.round(SS.acertos/SS.unicos*100)}%</b>acerto</span><span><b>🔥 ${S.streak.n||0}</b>${S.streak.n===1?'dia':'dias'}</span><span><b>×${SS.maxCombo}</b>combo</span></div>
    <button class="btn" id="ok">Fechar</button>`;
  document.body.appendChild(e);
  confete(diaFeito?140:60);
  $('#ok').onclick=()=>{CFSTOP=true;e.remove();sair()};
}

/* ===== Confete ===== */
function confete(n){
  const cv=$('#cf'),ctx=cv.getContext('2d'),W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cor=['#7A2E3B','#C9967A','#E8C4B0','#D98C9A','#B7822F'];
  const p=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*80,y:H*.38,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,s:Math.random()*6+4,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cor[Math.random()*cor.length|0]}));
  let t=0;CFSTOP=false;(function f(){if(CFSTOP){ctx.clearRect(0,0,W,H);return}ctx.clearRect(0,0,W,H);p.forEach(q=>{q.vy+=.32;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);ctx.restore()});if(++t<120)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})();
}

/* ===== Início ===== */
carregar().then(render).then(syncProg).then(syncNotas).then(syncEdits).then(convidarEntrar);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!SS){carregar().then(render).then(syncProg).then(syncNotas).then(syncEdits)}});
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
